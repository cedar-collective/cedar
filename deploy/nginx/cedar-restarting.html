<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="10">
  <title>CEDAR Is Restarting</title>
  <script>
    /* The reader's CEDAR mode (www/cedar-theme.js keeps it per browser, and
       this page is served from the same site): dark only if they chose it. */
    try {
      if (window.localStorage.getItem('cedar-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { /* storage blocked: light */ }
  </script>
  <style>
    :root {
      color-scheme: light;
      --cedar-blue: #2f6f9f;
      --cedar-blue-dark: #1e557e;
      --cedar-ink: #20323f;
      --cedar-muted: #5d7180;
      --cedar-line: #d8e6ee;
      --cedar-bg: #f4f8fa;
      --cedar-panel: #ffffff;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --cedar-blue: #7f9fd6;
      --cedar-blue-dark: #9fb9e4;
      --cedar-ink: #e4e2dc;
      --cedar-muted: #b9b7b0;
      --cedar-line: #3d4240;
      --cedar-bg: #161a18;
      --cedar-panel: #1e2321;
    }

    :root[data-theme="dark"] main {
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        linear-gradient(180deg, rgba(47, 111, 159, 0.08), rgba(47, 111, 159, 0)),
        var(--cedar-bg);
      color: var(--cedar-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 42rem);
      padding: 2rem;
      border: 1px solid var(--cedar-line);
      border-radius: 8px;
      background: var(--cedar-panel);
      box-shadow: 0 18px 45px rgba(32, 50, 63, 0.12);
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--cedar-blue-dark);
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 1rem 0 0;
      color: var(--cedar-muted);
      font-size: 1.05rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
      color: var(--cedar-blue-dark);
      font-weight: 650;
    }

    .spinner {
      width: 1.25rem;
      height: 1.25rem;
      border: 3px solid rgba(47, 111, 159, 0.2);
      border-top-color: var(--cedar-blue);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      flex: 0 0 auto;
    }

    a {
      color: var(--cedar-blue-dark);
      font-weight: 700;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <p class="eyebrow">CEDAR update in progress</p>
    <h1>CEDAR is restarting after an important update.</h1>
    <p>It should be running again in the next minute or so. This page will keep checking automatically.</p>
    <div class="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Checking again every 10 seconds</span>
    </div>
    <p><a href="/">Try CEDAR now</a></p>
  </main>
</body>
</html>
