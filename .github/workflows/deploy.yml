name: Test and Deploy CEDAR

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.gitignore'
      # This docs data file is also shipped runtime metadata for Shiny.
      - 'docs/_data/definitions.yml'
  workflow_dispatch:

concurrency:
  group: cedar-production-deploy
  cancel-in-progress: true

jobs:
  # Gate: build the same image production runs, then invoke CEDAR's canonical
  # selector + R gate inside it. Browser suites remain the local release gate
  # because this image intentionally has no browser.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (same Dockerfile as production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shiny
          load: true
          tags: cedar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run canonical selector and R gate inside the image
        run: |
          docker run --rm --user root --entrypoint bash cedar:ci \
            ./run-tests.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        # Third-party action with access to the deploy key — pinned to the
        # commit SHA of v1.2.0 so a moved tag can't change what runs.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          # The droplet builds the image itself; allow more than the 10m default.
          # A projection rebuild publishes one bundle PER SEASON and measured 20
          # minutes for a single target on this droplet (against ~4 locally), so
          # 30m no longer fits the work it has to do. A rebuild killed by this
          # timeout leaves its lock directory behind and blocks the next morning
          # refresh, which is why the margin is generous rather than tight.
          command_timeout: 60m
          script: |
            set -e

            cd "${{ secrets.CEDAR_PATH }}"

            MIN_FREE_KB=2097152

            free_kb() {
              df -Pk . | awk 'NR == 2 { print $4 }'
            }

            print_disk_report() {
              echo "Filesystem usage for deploy paths:"
              df -h . /var/lib/docker 2>/dev/null || df -h .
              echo
              echo "Docker disk usage:"
              docker system df || true
            }

            ensure_deploy_space() {
              avail_kb="$(free_kb)"
              echo "Deploy checkout free space: $((avail_kb / 1024)) MiB"

              if [ "$avail_kb" -ge "$MIN_FREE_KB" ]; then
                return 0
              fi

              echo "::warning::Low disk space before deploy; pruning unused Docker build cache, images, and containers."
              print_disk_report

              docker builder prune -af || true
              docker image prune -af || true
              docker container prune -f || true

              avail_kb="$(free_kb)"
              echo "Deploy checkout free space after prune: $((avail_kb / 1024)) MiB"
              print_disk_report

              if [ "$avail_kb" -lt "$MIN_FREE_KB" ]; then
                echo "::error::Production host still has less than $((MIN_FREE_KB / 1024)) MiB free after Docker cleanup."
                echo "Largest paths under deploy checkout:"
                du -xhd1 . 2>/dev/null | sort -h | tail -20 || true
                echo "Largest paths under /var/lib/docker:"
                du -xhd1 /var/lib/docker 2>/dev/null | sort -h | tail -20 || true
                exit 1
              fi
            }

            ensure_deploy_space

            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            # Build before maintenance mode so the old app can keep serving
            # while the new image is prepared.
            docker compose build cedar-shiny

            RESTARTING_FLAG="${{ secrets.CEDAR_RESTARTING_FLAG }}"
            if [ -z "$RESTARTING_FLAG" ]; then
              RESTARTING_FLAG="/var/www/cedar-maintenance/restarting.flag"
            fi
            MAINTENANCE_DIR="$(dirname "$RESTARTING_FLAG")"
            RESTARTING_ENABLED=false

            # A deploy whose SSH connection drops mid-script leaves this marker
            # behind — the EXIT trap below never runs, and nginx keeps serving
            # the restart page to every visitor until someone removes it by
            # hand. Sweep it before writing our own so a stranded marker can
            # never outlive one deploy, and say so: a marker still here means
            # the previous deploy did not finish cleanly.
            if [ -f "$RESTARTING_FLAG" ]; then
              echo "::warning::Restart marker left by an earlier deploy; clearing it."
              echo "Stranded marker: $(cat "$RESTARTING_FLAG" 2>/dev/null || true)"
              rm -f "$RESTARTING_FLAG" || true
            fi

            clear_restarting() {
              if [ "$RESTARTING_ENABLED" = true ]; then
                rm -f "$RESTARTING_FLAG" || true
              fi
            }
            trap clear_restarting EXIT

            if mkdir -p "$MAINTENANCE_DIR"; then
              if [ -f deploy/nginx/cedar-restarting.html ]; then
                if cp deploy/nginx/cedar-restarting.html "$MAINTENANCE_DIR/cedar-restarting.html"; then
                  echo "Restart page installed at $MAINTENANCE_DIR/cedar-restarting.html"
                else
                  echo "Could not copy restart page to $MAINTENANCE_DIR; continuing deploy."
                fi
              fi
              if printf 'CEDAR deploy restart started at %s\n' "$(date -Is)" > "$RESTARTING_FLAG"; then
                RESTARTING_ENABLED=true
                echo "Restart marker enabled at $RESTARTING_FLAG"
              else
                echo "Could not write restart marker at $RESTARTING_FLAG; continuing deploy."
              fi
            else
              echo "Could not create maintenance directory $MAINTENANCE_DIR; continuing deploy."
            fi

            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f || true

            # Health check: compose reports success as soon as the container
            # starts, but the app isn't up until shiny-server serves the page
            # (and the first real request triggers the heavy global.R data
            # load). Poll for up to 5 minutes before calling the deploy good.
            echo "Waiting for app to respond at http://localhost:3838/ ..."
            APP_UP=false
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null --max-time 20 http://localhost:3838/; then
                echo "Health check passed on attempt $i."
                APP_UP=true
                break
              fi
              sleep 5
            done

            if [ "$APP_UP" != true ]; then
              echo "Health check FAILED after 5 minutes. Recent container logs:"
              docker compose logs --tail 100 cedar-shiny
              exit 1
            fi

            # The app is serving, so the restart page has no purpose from here
            # on. Clear it at this point rather than leaving it to the EXIT
            # trap: everything below is post-deploy work, and a connection that
            # drops during it must not strand the site in maintenance mode. The
            # trap remains the backstop for a failure before this line.
            clear_restarting
            RESTARTING_ENABLED=false

            # Rebuild the projection bundle only when the projection MODEL
            # changed in this deploy.
            #
            # Shiny never fits a model, so a saved bundle built by older code
            # is not automatically replaced. A schema or scoring change
            # therefore leaves the Projections page showing its empty state
            # until something rebuilds — which used to mean waiting for the
            # next morning refresh, or remembering to do it by hand.
            #
            # The gate is cheap on purpose. It compares every saved bundle's
            # recorded schema version, model version, and per-file model source
            # hashes against the deployed source, and loads no CEDAR table: a
            # no-change deploy costs about a second. A real rebuild publishes
            # every target the policy names -- currently the next Fall and the
            # next Spring -- and measured 20 minutes per target on this droplet.
            # Most deploys touch no projection source at all.
            #
            # This gate owns MODEL staleness only. Data-driven staleness stays
            # with the morning refresh, which still runs the full signature
            # comparison including prepared inputs.
            #
            # A failure here leaves the previous bundle in place, is reported,
            # and is retried by the next morning refresh. The guard below turns
            # an ordinary nonzero exit into a warning; a hard failure that takes
            # the whole session with it still cannot strand the site, because
            # the restart marker was cleared as soon as the health check passed.
            # This is by far the longest-running step when it does rebuild, so
            # it is also the likeliest place to lose the session.
            # Rebuild cedar_programs when the MAPPING source changed.
            #
            # dept_code is derived at transform time, so editing a mapping list
            # changes nothing until the table is rebuilt -- and nothing says the
            # two have drifted, because the stored dept_code stays plausible and
            # every report keeps using it. A mapping fix can sit in the
            # repository while production serves the old departments; a stale
            # map hid 194 of 229 Radiologic Sciences students for nine months
            # (ISSUES.md I7).
            #
            # Cheap by design: five file hashes against a fingerprint stamped on
            # the table, touching no CEDAR table, so a deploy that changed no
            # mapping costs about a second. Data-driven staleness stays with the
            # morning refresh.
            echo "Checking whether the mapping source changed in this deploy..."
            if docker compose exec -T cedar-shiny \
                 Rscript --vanilla \
                 /srv/shiny-server/cedar/scripts/rebuild-programs-if-mappings-changed.R \
                 < /dev/null; then
              echo "Mapping check complete."
            else
              echo "WARNING: mapping check or cedar_programs rebuild failed."
              echo "The previous cedar_programs is retained; the next data refresh retries."
            fi

            echo "Checking whether the projection model changed in this deploy..."
            # cedar-projections, not cedar-shiny: the app service mounts output/
            # read-only and a CLI --volume does not override that, so the build
            # died on a read-only filesystem before it could write anything.
            #
            # </dev/null matters. The deploy script reaches the droplet on the
            # SSH session's stdin, and `docker compose run` inherits it — an
            # attached run consumes the rest of the script as container input.
            if docker compose run --rm --no-deps -T \
                 --user "$(id -u):$(id -g)" cedar-projections \
                 scripts/build-enrollment-projections.R --refresh-if-model-changed \
                 < /dev/null; then
              echo "Projection model check complete."
            else
              echo "WARNING: projection model check or rebuild failed."
              echo "The previous bundle is retained; the next morning refresh retries."
            fi

            exit 0
