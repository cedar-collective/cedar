name: Test and Deploy CEDAR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: cedar-production-deploy
  cancel-in-progress: true

jobs:
  # Gate: build the same image production runs, then invoke CEDAR's canonical
  # selector + R gate inside it. Browser suites remain the local release gate
  # because this image intentionally has no browser.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (same Dockerfile as production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shiny
          load: true
          tags: cedar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run canonical selector and R gate inside the image
        run: |
          docker run --rm --user root --entrypoint bash cedar:ci \
            ./run-tests.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        # Third-party action with access to the deploy key — pinned to the
        # commit SHA of v1.2.0 so a moved tag can't change what runs.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          # The droplet builds the image itself; allow more than the 10m default.
          command_timeout: 30m
          script: |
            set -e

            cd "${{ secrets.CEDAR_PATH }}"

            MIN_FREE_KB=2097152

            free_kb() {
              df -Pk . | awk 'NR == 2 { print $4 }'
            }

            print_disk_report() {
              echo "Filesystem usage for deploy paths:"
              df -h . /var/lib/docker 2>/dev/null || df -h .
              echo
              echo "Docker disk usage:"
              docker system df || true
            }

            ensure_deploy_space() {
              avail_kb="$(free_kb)"
              echo "Deploy checkout free space: $((avail_kb / 1024)) MiB"

              if [ "$avail_kb" -ge "$MIN_FREE_KB" ]; then
                return 0
              fi

              echo "::warning::Low disk space before deploy; pruning unused Docker build cache, images, and containers."
              print_disk_report

              docker builder prune -af || true
              docker image prune -af || true
              docker container prune -f || true

              avail_kb="$(free_kb)"
              echo "Deploy checkout free space after prune: $((avail_kb / 1024)) MiB"
              print_disk_report

              if [ "$avail_kb" -lt "$MIN_FREE_KB" ]; then
                echo "::error::Production host still has less than $((MIN_FREE_KB / 1024)) MiB free after Docker cleanup."
                echo "Largest paths under deploy checkout:"
                du -xhd1 . 2>/dev/null | sort -h | tail -20 || true
                echo "Largest paths under /var/lib/docker:"
                du -xhd1 /var/lib/docker 2>/dev/null | sort -h | tail -20 || true
                exit 1
              fi
            }

            ensure_deploy_space

            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            # Build before maintenance mode so the old app can keep serving
            # while the new image is prepared.
            docker compose build cedar-shiny

            RESTARTING_FLAG="${{ secrets.CEDAR_RESTARTING_FLAG }}"
            if [ -z "$RESTARTING_FLAG" ]; then
              RESTARTING_FLAG="/var/www/cedar-maintenance/restarting.flag"
            fi
            MAINTENANCE_DIR="$(dirname "$RESTARTING_FLAG")"
            RESTARTING_ENABLED=false

            clear_restarting() {
              if [ "$RESTARTING_ENABLED" = true ]; then
                rm -f "$RESTARTING_FLAG" || true
              fi
            }
            trap clear_restarting EXIT

            if mkdir -p "$MAINTENANCE_DIR"; then
              if [ -f deploy/nginx/cedar-restarting.html ]; then
                if cp deploy/nginx/cedar-restarting.html "$MAINTENANCE_DIR/cedar-restarting.html"; then
                  echo "Restart page installed at $MAINTENANCE_DIR/cedar-restarting.html"
                else
                  echo "Could not copy restart page to $MAINTENANCE_DIR; continuing deploy."
                fi
              fi
              if printf 'CEDAR deploy restart started at %s\n' "$(date -Is)" > "$RESTARTING_FLAG"; then
                RESTARTING_ENABLED=true
                echo "Restart marker enabled at $RESTARTING_FLAG"
              else
                echo "Could not write restart marker at $RESTARTING_FLAG; continuing deploy."
              fi
            else
              echo "Could not create maintenance directory $MAINTENANCE_DIR; continuing deploy."
            fi

            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f || true

            # Health check: compose reports success as soon as the container
            # starts, but the app isn't up until shiny-server serves the page
            # (and the first real request triggers the heavy global.R data
            # load). Poll for up to 5 minutes before calling the deploy good.
            echo "Waiting for app to respond at http://localhost:3838/ ..."
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null --max-time 20 http://localhost:3838/; then
                echo "Health check passed on attempt $i."
                exit 0
              fi
              sleep 5
            done

            echo "Health check FAILED after 5 minutes. Recent container logs:"
            docker compose logs --tail 100 cedar-shiny
            exit 1
