name: PR Checks

# Test untrusted contributions on a disposable hosted runner, never the deploy host.
# No path exclusions: a required check must also finish on documentation-only PRs.
'on':
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cedar-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-checks:
    name: Synthetic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CEDAR_URL: http://127.0.0.1:3839/
      CEDAR_DEV_IMAGE: cedar:pr-test
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: '.'
          file: Dockerfile.shiny
          target: app
          platforms: linux/amd64
          load: true
          push: false
          tags: cedar:pr-test
          cache-from: type=gha,scope=cedar-pr
          cache-to: type=gha,scope=cedar-pr,mode=max

      - name: Install browser harness
        run: npm ci --prefix tests/e2e

      - name: Start isolated synthetic app from the tested image
        run: >-
          docker compose --env-file /dev/null -p cedar-demo -f compose.dev.yml
          up -d --no-build --pull never

      - name: Run canonical selector, R, and demo browser checks
        run: ./run-tests.sh --test-image cedar:pr-test --e2e demo

      - name: Collect synthetic app logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cedar-pr-diagnostics"
          docker compose --env-file /dev/null -p cedar-demo -f compose.dev.yml \
            logs --no-color > "$RUNNER_TEMP/cedar-pr-diagnostics/compose.log" 2>&1

      - name: Upload synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cedar-synthetic-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/cedar-pr-diagnostics/
            /tmp/cedar-synthetic-demo.png

      - name: Stop synthetic app
        if: always()
        run: docker compose --env-file /dev/null -p cedar-demo -f compose.dev.yml down
