name: PR Checks

# Test untrusted contributions on a disposable hosted runner, never the deploy host.
# No path exclusions: a required check must also finish on documentation-only PRs.
'on':
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cedar-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-checks:
    name: Synthetic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CEDAR_URL: http://127.0.0.1:3838/
      CEDAR_DEV_IMAGE: cedar:pr-test
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: '.'
          file: Dockerfile.shiny
          target: app
          platforms: linux/amd64
          load: true
          push: false
          tags: cedar:pr-test
          cache-from: type=gha,scope=cedar-pr
          cache-to: type=gha,scope=cedar-pr,mode=max

      - name: Install browser harness
        run: npm ci --prefix tests/e2e

      - name: Start isolated synthetic app from the tested image
        run: >-
          docker compose --env-file /dev/null -p cedar-demo -f compose.dev.yml
          up -d --no-build --pull never

      - name: Run canonical selector, R, and demo browser checks
        run: ./run-tests.sh --test-image cedar:pr-test --e2e demo

      - name: Collect synthetic app logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cedar-pr-diagnostics"
          docker compose --env-file /dev/null -p cedar-demo -f compose.dev.yml \
            logs --no-color > "$RUNNER_TEMP/cedar-pr-diagnostics/compose.log" 2>&1

      - name: Upload synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cedar-synthetic-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/cedar-pr-diagnostics/
            /tmp/cedar-synthetic-demo.png

      - name: Stop synthetic app
        if: always()
        run: docker compose --env-file /dev/null -p cedar-demo -f compose.dev.yml down

  # Which files of the proposed merge are projection model source. An edit to
  # one, a comment included, makes the deploy after the merge rebuild both
  # projection bundles, and nothing said so until the deploy had run 45
  # minutes (ISSUES M77). The job after this one carries the answer in its
  # name, so the list of checks shows it to whoever is about to merge.
  model-source:
    name: Projection model source in the diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The merge commit and its first parent, which is main.
          fetch-depth: 2

      - name: List the model-source files the merge would change
        id: diff
        run: |
          touched="$(git diff --name-only HEAD^1 HEAD | bash scripts/projection-model-source.sh --touched)"
          echo "touched=$(printf '%s' "$touched" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          if [ -z "$touched" ]; then
            echo "No projection model source in this diff."
            exit 0
          fi
          printf '%s\n' "$touched" | while IFS= read -r file; do
            echo "::warning file=${file},line=1::Projection model source: merged, this change makes the next deploy rebuild both projection bundles (about 45 minutes)."
          done

  deploy-cost:
    name: "${{ needs.model-source.outputs.touched != '' && 'Deploy: rebuilds both projection bundles (about 45 minutes)' || 'Deploy: no projection rebuild' }}"
    needs: model-source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Say what the deploy after this merge does
        env:
          TOUCHED: ${{ needs.model-source.outputs.touched }}
        run: |
          if [ -z "$TOUCHED" ]; then
            echo "No projection model source in the diff: the deploy rebuilds no bundle."
            exit 0
          fi
          echo "Projection model source in the diff: ${TOUCHED}"
          {
            echo "### The deploy after this merge rebuilds both projection bundles"
            echo
            echo "Projection model source in the diff: \`${TOUCHED% }\`"
            echo
            echo "That is about 45 minutes of a deploy step that is stopped at 60 (ISSUES M77, I6)."
            echo "If no projection reads the change, it belongs in a file that is not on the list"
            echo "(\`bash scripts/projection-model-source.sh\` prints it). If the model did change,"
            echo "merge this pull request by itself and let its deploy finish."
          } >> "$GITHUB_STEP_SUMMARY"
