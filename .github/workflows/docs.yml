name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # Healthy Pages publishes here finish quickly; when the service gets
          # stuck in "deployment_in_progress", retrying once is more effective
          # than waiting far past the default timeout.
          timeout: 600000
          reporting_interval: 10000

      - name: Retry GitHub Pages deploy once
        if: steps.deployment_primary.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000

      - name: Fail if both deploy attempts failed
        if: steps.deployment_primary.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deploy stayed in deployment_in_progress on both attempts."
          exit 1
