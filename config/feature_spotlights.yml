# Evergreen homepage tips for useful CEDAR features.
# These are intentionally separate from changelog.yml: changelog entries are
# chronological release history, while spotlights are rotating "did you know?"
# prompts for features that may remain useful long after release.

spotlights:
  - title: "Course titles matter for topics courses"
    text: "In Pathways > Course to Major, course + instructor signals keep course titles with the course number so topics courses do not collapse into one generic row."
    icon: "tags"
    tab: "pathways"
    cta: "Open Pathways"

  - title: "Jump from Regstats to Waitlists"
    text: "High-waitlist rows can take you straight to the Waitlists tool, where you can inspect who is waiting by program and classification."
    icon: "clipboard-list"
    tab: "waitlists"
    cta: "Open Waitlists"

  - title: "Headcount is program-based"
    text: "Explore > Headcount counts unique students with active declared program records, not students sitting in a department's courses."
    icon: "users"
    tab: "headcount"
    cta: "Open Headcount"

  - title: "Cancellations has timing context"
    text: "Explore > Cancellations shows cancelled sections and timing relative to course start, with repeated cancellation patterns by course."
    icon: "ban"
    tab: "cancellations"
    cta: "Open Cancellations"

  - title: "Gen Ed can be scoped"
    text: "Explore > Gen Ed can be filtered by campus, college, department, area, level, and term window before reviewing enrollment and outcome patterns."
    icon: "graduation-cap"
    tab: "gen-ed"
    cta: "Open Gen Ed"

  - title: "Major movement cards are descriptive"
    text: "Pathways > Major Changes separates pre-major, full-major, conversion, and departure timing so chairs can see movement without treating it as a verdict."
    icon: "route"
    tab: "pathways"
    cta: "Open Major Changes"

  - title: "DFW by term connects the dots"
    text: "Course Dynamics shows DFW, early drops, and late drops as term-by-term lines for one selected course."
    icon: "chart-line"
    tab: "course-dynamics"
    cta: "Open Course Dynamics"

  - title: "Who is receiving DFW outcomes?"
    text: "Course Dynamics breaks DFW outcomes out by classification and major so the aggregate rate has human context."
    icon: "users"
    tab: "course-dynamics"
    cta: "Open DFW"

  - title: "DFW has term context"
    text: "Course Dynamics can show whether students who DFW the selected course were passing most other courses or struggling across the term."
    icon: "chart-pie"
    tab: "course-dynamics"
    cta: "Open DFW"

  - title: "Retention has benchmarks"
    text: "Course Retention compares next-term persistence for the selected course against department and college patterns."
    icon: "chart-line"
    tab: "course-dynamics"
    cta: "Open Retention"

  - title: "Enrollment movers are surfaced"
    text: "Dept Trends highlights courses with the largest long-term enrollment increases and decreases."
    icon: "chart-area"
    tab: "dept-trends"
    cta: "Open Dept Trends"

  - title: "Repeated topics are visible"
    text: "Dept Trends calls out repeated topics courses so recurring special topics are reviewable without looking like duplicate rows."
    icon: "tags"
    tab: "dept-trends"
    cta: "Open Enrollment Trends"

  - title: "Open Seats handles topics courses"
    text: "Open Seats keeps course titles in the course identity where needed, so topics sections do not repeat or collapse incorrectly."
    icon: "chair"
    tab: "open-seats"
    cta: "Open Seats"

  - title: "Data mapping is visible"
    text: "Admin > Data & Usage includes mapping review tables for program, subject, and department codes."
    icon: "database"
    tab: "data-usage"
    cta: "Open Data & Usage"

  - title: "Release notes live in the app"
    text: "Admin > Changelog mirrors the homepage updates so users can see what changed without leaving CEDAR."
    icon: "history"
    tab: "changelog"
    cta: "Open Changelog"
