# CEDAR Changelog Configuration
# Following CEDAR patterns for modular configuration

changelog:
  
  - version: "v.9.5.0"
    date: "2026-03-27"
    title: "Major Changes analytics and Pathways reorganization"
    type: "minor"
    items:
      - "New PATHWAYS tab with summary header, sparklines, donuts to show common movements"
      - "New POPULATION BUILDER pane for focus groups, entry points and outcomes"
      - "Add visualizations and analytics for outside majors in unit courses (in dept profile)"
      - "Population Trend visualization moved to the Dept Profile / Demographics tab"      
      - "Move away from report tab/ethos to more vibrant EXPLORE menu"
      - "Massive test suite standardization, simplification and labeling for functionality testing"
      - "Simplify major, program, department code handling and lookups for consistency"
      - "Revise documentation to reflect new functionality and data model"


  - version: "v.9.4.1"
    date: "2026-03-12"
    title: "Gen Ed plots for departments"
    type: "minor"
    items:
      - "Create new gen ed plots showing when students take them based on classification, total credit, institution credits, semester"

  - version: "v.9.4.0"
    date: "2026-03-12"
    title: "Department dashboard and codebase cleanup"
    type: "minor"
    items:
      - "Department dashboard UI enhancements and clearer data display."
      - "Standardized usage and lookups of department, program, and subject codes across modules for consistency."
      - "Removed data transformation steps from aggregation logic—aggregation now operates on clean, pre-transformed data."
      - "Improved code clarity and maintainability by separating domain mapping from reporting and analytics steps."
      - "Reduce dependency on hardcoded code lists and mappings, moving towards dynamic lookups based on data content where possible."
      - "Minor bug fixes and UI polish."

  - version: "v.9.3.0"
    date: "2026-03-09"
    title: "Explore Your Unit department dashboard"
    type: "minor"
    items:
      - "New Explore Your Unit tab lets any user select a department and see a full picture of its enrollment health: headcount trends, credit hour production, student composition, course performance vs. historical averages, and drop rate comparisons"
      - "Headcount summary cards show current enrollment with trend arrows vs. the last four same-season terms"
      - "Credit hour production chart displays a five-year trend broken down by course level (lower, upper, grad)"
      - "Student composition donuts show who takes your courses by declared major and class standing, comparing the current term to a five-year average"
      - "Course enrollment table flags sections running above or below their historical average, courses new this term, and courses that offered previously but are missing this term"
      - "Drop rate tables compare early (pre-census) and late (DW/DG) drop rates by course level against each course's own historical average, highlighting outliers"
      - "Dashboard shows an image placeholder before a department is selected instead of blank space"
      - "Admin data status page now shows per-term data freshness dates in a compact table with the current term highlighted"
      - "Admin usage analytics default to today's date and load automatically when the tab is opened"
      - "Usage event log shows human-readable event labels and extracts key details (department, course) from JSON log entries"

  - version: "v.9.2.0"
    date: "2026-03-04"
    title: "Enrollment tab reliability and deployment automation"
    type: "minor"
    items:
      - "Extended crosslist handling with external partners and improved crosslisted course tab behavior"
      - "Enrollment dashboard now reliably initializes low-enrollment tab content on first interaction"
      - "Added a unified update-data pipeline script for MyReports fetch, parse, transform, and app reload workflows"
      - "Added production/local execution modes plus dry-run support with explicit command preview for safer operations"      

  - version: "v.9.1.1"
    date: "2026-03-03"
    title: "Crosslisting tab, UI enhancements, and data handling improvements"
    type: "minor"
    items:
      - "New crosslist tabs for home and away sections of the enrollment dashboard now properly filter for cross-listed courses"
      - "Compact filter layout reduces vertical space consumption in Enrollment tab"
      - "Improved admin page with tabbed interface for usage analytics"
      - "Cleaner renv and docker separation"

  - version: "v.9.1.0"
    date: "2026-02-27"
    title: "Low Enrollment Dashboard & Future Term Analysis"
    type: "minor"
    items:
      - "Consolidate low enrollment and basic enrollment concerns into a single dashboard with tabs for different course types and thresholds"
      - "Low enrollment 'future mode' compares proposed schedule to historical data, showing sections that may struggle with enrollment based on past trends"
      - "Enhanced future term support: DESR tab now displays proposed schedules when Min Enrollment set to 0"
      - "Improved data validation in summarize_courses() with column existence checking and better NA handling"
      - "Added diagnostic logging to track data flow through get_enrl() and aggregation pipeline"
      - "Added intelligent filter warning when enrollment min/max eliminates all data (especially helpful for future terms with 0 enrollment)"
      - "Filter warnings suggest setting Min Enrollment to 0 for future/proposed schedule viewing"


  - version: "v.9.0.0"
    date: "2026-02-06"
    title: "New Data Model and testing framework"
    type: "major"
    items:
      - "Implemented a new unified data model for CEDAR, abstracting from original data files (that are still preserved)"
      - "Added comprehensive test suite with testthat"
      - "Added password protection for DFW reporting"
      - "Improved department report visualizations"
      - "Refactored data model to use a unified 'cedar_data' object for all data types (enrollment, sfr, headcount, etc.)"
      - "Fixed department report path issues and standardized path construction across all 5 report types (dept, course, regstats, seatfinder, forecast) using file.path()"      

