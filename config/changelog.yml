# CEDAR Changelog Configuration
# Following CEDAR patterns for modular configuration

changelog:

  - version: "v1.1.0"
    date: "2026-09-04"
    title: "CEDAR 1.1 — consistent definitions, clearer measures, and faster reports"
    type: "minor"
    highlights:
      - title: "One explanation follows each metric"
        text: "Versioned definition records now supply the app and documentation site, replacing competing methodology copy while preserving the population, exclusions, limits, and implementation behind a number."
        icon: "book-open"
        tab: "changelog"
      - title: "Enrollment counts show their lifecycle"
        text: "Explore Enrollment now keeps the DESR snapshot, class-list registered count, reconstructed census estimate, and early and late drops distinct so similarly named measures are not mistaken for one another."
        icon: "timeline"
        tab: "enrollment"
      - title: "Registration signals use shared evidence"
        text: "Regstats now compares against strictly earlier matching terms, uses lifecycle-aware saturation and drop context, and shares the same true-demand waitlist count as the Waitlists tool."
        icon: "traffic-light"
        tab: "registration"
      - title: "See what students take alongside a course"
        text: "Course Dynamics adds a concurrent-course treemap and ranked table, alongside clearer downstream, sequence, and retention comparisons with visible eligibility and campus scope."
        icon: "diagram-project"
        tab: "course-dynamics"
      - title: "Faster reports for shared use"
        text: "Dept Trends tabs are precomputed and cache ready-to-render charts, Regstats does less work on a cold request, and report timing now reflects the browser-visible wait."
        icon: "gauge-high"
        tab: "dept-trends"
    improvements:
      - title: "Versioned metric definitions"
      - title: "Pathways methodology moved to the docs"
        tab: "pathways"
      - title: "True waitlist demand across tools"
        tab: "waitlists"
      - title: "Waitlist drill-through keeps its scope"
        tab: "waitlists"
      - title: "Lifecycle-aware Regstats saturation"
        tab: "registration"
      - title: "Consistent Gen Ed DFW rules"
        tab: "gen-ed"
      - title: "Course Sequence balance labels"
        tab: "course-dynamics"
      - title: "Course-attempt history repaired"
        tab: "course-dynamics"
      - title: "Campus-specific retention benchmarks"
        tab: "course-dynamics"
      - title: "Complete-term outcome windows"
        tab: "course-dynamics"
      - title: "Dept Trends precomputed charts"
        tab: "dept-trends"
      - title: "Accurate report timing estimates"
        tab: "data-usage"
      - title: "Lower shared-session memory use"
      - title: "Batched low-enrollment history"
        tab: "enrollment"
    items:
      - "Established shared, versioned definition records as the source for metric explanations in both Shiny and the documentation site. Page summaries, detail panels, guide links, and implementation references now resolve from the same records; the separate Pathways Methodology tab was removed."
      - "Reconciled enrollment language and outputs across Explore Enrollment and Course Dynamics. DESR enrolled remains an extract-timed section snapshot, while class-list registered, reconstructed census, and early/late-drop lifecycle counts are labeled and displayed separately."
      - "Rebuilt Regstats baselines around strictly earlier matching offerings with a common population-SD policy. Saturation now matches the class-list census proxy to usable DESR scheduled capacity, and count-selected drop alerts show lifecycle-adjusted rates as context."
      - "Unified waitlist demand across Regstats, Waitlists, and the Department Dashboard: distinct waitlisted students are counted only after removing matching registered students and duplicates. Regstats drill-through carries course title, campus, college, term, part of term, department, and level into Waitlists."
      - "Aligned the CEDAR-wide DFW policy and labels in Course Dynamics and Gen Ed, including late-drop outcomes, audit exclusions, unfamiliar recorded grades, and the visible opt-in exception for passing work below C where a page supports it."
      - "Expanded Course Dynamics with concurrent-course analysis and strengthened downstream, sequence, and retention views. Comparisons now expose eligibility and observation windows, preserve campus, use complete longitudinal terms, and distinguish descriptive instructor profiles from balance evidence."
      - "Fixed course-attempt preservation when CRNs are reused across terms, preventing valid historical attempts from being collapsed before outcome analysis."
      - "Improved multi-user performance by precomputing Dept Trends tab payloads, caching compact ready-to-render charts, dropping raw source tables from session state, batching low-enrollment history calculations, and reducing Regstats cold-path work. Cache writes are atomic where concurrent workers may target the same file."
      - "Protected Explore Enrollment from unscoped full-history runs, added Undergraduate as the default level, retained course selections in share links, and reused the filtered section payload for its campus-by-level chart."
      - "Made Course Dynamics Overview crosslist-aware: headline lifecycle counts combine every active partner listing, while cards show the selected course code separately and section measures use the shared home-section enrollment path."
      - "Added end-to-end performance logging for server calculation, delivery wait, browser rendering, payload size, worker memory, cache status, and connected sessions. Loading estimates now learn from observed median-to-P90 browser-visible durations instead of presenting a fixed two-second estimate."
      - "Expanded data-integrity, analytical, cache, definition, and browser regression coverage, including cross-tab reconciliation checks and a standard warmup/retry path for the shared Shiny worker."

  - version: "v1.0.0"
    date: "2026-08-09"
    title: "CEDAR 1.0 — numbers you can take to a meeting"
    type: "major"
    highlights:
      - title: "Methods are open to inspection"
        text: "Non-obvious calculations now carry concise explanations and links to user documentation, methodology details, and the code that implements them."
        icon: "circle-info"
      - title: "Grade rates stop at the last graded term"
        text: "DFW and other grade-based rates now end at the most recent term with grades actually posted, instead of counting a term whose grades have not landed. That term used to read as a dramatic improvement."
        icon: "clock"
        tab: "course-dynamics"
      - title: "Course timing is measured, not assumed"
        text: "Pathways Course Timing now defaults to Classification, the one axis that works for every student. The credit axes exclude students whose record starts before the data does, and say how many were set aside and why."
        icon: "route"
        tab: "pathways"
      - title: "Gen Ed for your graduates"
        text: "Dept Trends Gen Ed now shows when your graduates took Gen Ed courses, which ones, and how your own unit's Gen Ed offerings fit into their path."
        icon: "layer-group"
        tab: "dept-trends"
      - title: "Roadblocks, simplified"
        text: "Grade Setback has been folded into Roadblocks, subject filters default to your own department, and a plain-English explanation sits above the table."
        icon: "traffic-light"
        tab: "pathways"
      - title: "Campus stays visible in core course views"
        text: "Core course outcome and enrollment views retain campus as part of the analytical grain, so main, online, and branch delivery are not silently blended."
        icon: "sitemap"
    improvements:
      - title: "Consistent subtab headers"
        tab: "pathways"
      - title: "Brighter, accessible plot palette"
      - title: "One action colour for buttons that start work"
      - title: "Downstream courses from real student flow"
        tab: "course-dynamics"
      - title: "Courses students take alongside yours"
        tab: "course-dynamics"
      - title: "Shareable tab links centralized"
      - title: "Waitlist and campus scope stated on screen"
        tab: "waitlists"
    items:
      - "Established a field reliability contract for MyReports data. The Academic Studies report returns cumulative figures as of the moment it is pulled, stamped onto every historical row, so a row keyed to Fall 2021 does not necessarily describe Fall 2021. Institution GPA and the institution/overall credit columns are frozen across a student's own history for the large majority of students, and are no longer used to describe a past term anywhere in CEDAR."
      - "Credit position at a past term is now rebuilt from the per-term class-list series rather than read from those frozen columns. This corrected concrete numbers: History's median credits at major change moved from 107 to 31."
      - "Cumulative GPA used to compare student groups is likewise rebuilt, and measures each student's record entering the term being compared, so it excludes the outcome being measured. The registrar's current UNM GPA is still shown alongside it as description, clearly labelled, because it covers far more students."
      - "Report windows are now read from the data instead of a hand-maintained config value. Grade-based reporting ends at the last term with grades posted; enrollment reporting ends at the last term whose registration has settled. A DFW rate for the newest term previously read 0.3% against 6 to 8% for every other term, because the denominator counted all attempts while the numerator could only see the grades that had posted."
      - "Pathways Course Timing credit axes now exclude left-truncated students, whose running credit total would otherwise start mid-career at zero and place a senior in the lowest credit band. The count of excluded students is stated on the chart, with a pointer to the Classification axis, which includes them."
      - "Added Gen Ed uptake for a department's graduates in Dept Trends: a course-timing heatmap, per-course uptake, and a separate view of the unit's own Gen Ed courses, restricted to graduates whose full record is inside the data window."
      - "Merged Grade Setback into Roadblocks after review found it did not answer a question the DFW rate did not already answer, and defaulted Roadblocks subject filters to the viewing department."
      - "Added high-level explanations and documentation links around non-obvious calculations so readers can move from an on-screen result to its method and implementation."
      - "Consolidated the plot palette and validated it for colour-vision accessibility and contrast, and standardized the action colour used by buttons that start work."
      - "Course Dynamics downstream course lists are now built from where students actually go next, with a department rollup, rather than from a fixed list."
      - "Course Dynamics Course Flows now includes a treemap and ranked top-20 table of the courses students most often take alongside the selected course. Counts use registered class-list rows, preserve campus, and show both co-enrolled student-term totals and the share of selected-course student-terms taking both; the result reuses the existing course-and-campus flow cache."
      - "Core course outcome and enrollment analytics retain campus in their grouping grain so main, online, and branch delivery remain separable."
      - "Documented the data model and mapping decisions, and recorded how to run each test environment with its measured cost."

  - version: "v.10.4.0"
    date: "2026-07-30"
    title: "Pre-1.0 polish: clearer course outcomes, Dept Trends signals, and safer enrollment data"
    type: "minor"
    highlights:
      - title: "Course DFW clarity"
        text: "Course Dynamics now separates DFW, early drops, late drops, and who is affected, with clearer tables and explanatory notes."
        icon: "chart-line"
        tab: "course-dynamics"
      - title: "Dept Trends signals"
        text: "Enrollment trends now surface courses moving up or down over time, repeated topics courses, and more actionable review tables."
        icon: "chart-line"
        tab: "dept-trends"
      - title: "Retention benchmarks"
        text: "Course Retention now compares a course against department and college patterns and highlights instructor-level rows more readably."
        icon: "person-walking-arrow-right"
        tab: "course-dynamics"
      - title: "DFW term context"
        text: "Course Dynamics now helps show whether students who DFW a selected course were otherwise doing okay or struggling across the term."
        icon: "chart-pie"
        tab: "course-dynamics"
      - title: "Enrollment movers"
        text: "Dept Trends highlights the courses with the largest long-term enrollment increases and decreases."
        icon: "chart-area"
        tab: "dept-trends"
      - title: "Topics-course handling"
        text: "Open Seats and related course lists now preserve course-title identity where topics courses need it."
        icon: "tags"
        tab: "open-seats"
    improvements:
      - title: "Topics-course duplicate fix"
        tab: "open-seats"
      - title: "Waitlist row preservation"
        tab: "waitlists"
      - title: "DD status handling"
        tab: "course-dynamics"
      - title: "Cedar table styling"
        tab: "course-dynamics"
      - title: "Course Dynamics share links"
        tab: "course-dynamics"
      - title: "Instructor names in retention"
        tab: "course-dynamics"
      - title: "DFW warning cleanup"
        tab: "course-dynamics"
      - title: "Homepage hierarchy"
    items:
      - "Course Dynamics DFW was rebuilt around clearer outcome definitions: D/F/W grades and late drops count as DFW, early drops are shown separately, and unexpected registration statuses are reported near the DFW table when found."
      - "Added demographic DFW views by classification and major so users can see who is receiving DFW outcomes in a course without compressing everything into a single aggregate rate."
      - "Added a Course Dynamics DFW term-context view showing whether students who DFW the selected course were otherwise passing their courses, struggling in some other courses, or seeing DFW/non-pass outcomes across most of the term."
      - "Changed Course DFW and drop rates by term to a line chart and cleaned up overlapping legend/annotation behavior so term-to-term movement is easier to read."
      - "Converted Course Dynamics Enrollment, Rollcall, DFW, Grades, and Retention tables to the Cedar reactable style, with more human-readable column labels for class-list, drop, grade, and retention fields."
      - "Course Retention now includes difference-from-department and difference-from-college benchmark views, compact benchmark tables, and instructor highlight tables that use instructor names when available instead of encrypted IDs."
      - "Dept Trends enrollment gained trajectory review tables for courses with the largest enrollment increases and decreases over time, plus a repeated-topics section to make recurring topics courses visible without treating them as duplicate bugs."
      - "Open Seats and Seatfinder now join and group on full course identity, including title where needed, preventing distinct topics courses from repeating or collapsing incorrectly; regression coverage was added for topics courses."
      - "Class-list import now preserves existing waitlist rows when a replacement import omits waitlist data, and waitlist handling has focused tests so live WL rows are not silently erased."
      - "Registration status handling was centralized for DFW/drop analytics, including treating DD as an administrative early drop alongside DR and keeping late drops distinct for DFW."
      - "Added default-term configuration so current/upcoming term defaults are driven from configuration instead of hard-coded UI values."
      - "Bumped the Seatfinder cache version after the course-identity fix so deployed Open Seats results do not reuse stale cache objects."
      - "Started the CEDAR 1.0 release footing work with a release checklist, refreshed README/repository links, and a visible UI audit focused on consistency, transparency, and economy."

  - version: "v.10.3.0"
    date: "2026-06-20"
    title: "Major Changes revamp, observed-credit timing, and fuller user docs"
    type: "minor"
    highlights:
      - title: "Major movement timing"
        text: "Pathways now separates pre-major, full-major, conversion, and departure timing, with native and transfer students shown separately where possible."
        icon: "route"
        tab: "pathways"
      - title: "Observed UNM credits"
        text: "Major Changes credit medians now use class-list-derived UNM credits instead of source-system cumulative credit fields that can blur timing."
        icon: "clock"
        tab: "pathways"
    improvements:
      - title: "Course titles for topics courses"
        tab: "pathways"
      - title: "Major Changes methodology notes"
        tab: "pathways"
      - title: "User guide pages for Explore tools"
        tab: "changelog"
      - title: "Homepage feature spotlight"
      - title: "Gen Ed outcome denominators"
        tab: "gen-ed"
      - title: "Gen Ed major mix chart"
        tab: "gen-ed"
    items:
      - "Reworked Pathways > Major Changes around clearer movement questions: first pre-major record, first full-major record without prior pre-major, pre-major to full-major conversion, and departure to another program."
      - "Split Major Changes timing views by native UNM and transfer-entry students where the data support it, and added scope counts for students censored from timing cards because their observed UNM start is uncertain."
      - "Added cedar_student_term_credits in transform-to-cedar.R and wired it through app loading so Pathways can use class-list-derived completed and attempted UNM credits for movement cards and Common Pathways medians."
      - "Updated Course to Major title matching so course + instructor signals keep course titles aligned with the course number and instructor, preserving topics-course differences."
      - "Clarified Pathways methodology language in the app and user docs, including pre-major/full-major counting, term timing, observed credits, and the limits of descriptive course-to-major signals."
      - "Expanded user-facing docs with dedicated pages for Cancellations, Waitlists, Gen Ed, Headcount, and the revised Pathways workflow; removed the legacy cohort-analysis page from the user guide."
      - "Added a homepage Feature Spotlight strip backed by config/feature_spotlights.yml for evergreen tips that are useful but not necessarily new."
      - "Removed the Level input from Explore > Gen Ed and aligned Grade Distribution totals with the DFW outcome denominator; early drops remain visible in the DFW table but are excluded from grade-distribution totals."
      - "Added a Gen Ed major-mix donut based on enrollment-row major codes with same-term program records used for cleaner labels when available, and moved the top-course enrollment trend to a full-width chart with faded course lines and an average trend line."

  - version: "v.10.2.0"
    date: "2026-06-18"
    title: "Homepage What's New strip, UTF-8 source cleanup, and grade-plot fixes"
    type: "minor"
    items:
      - "Added a 'What's New' strip to the bottom of the home page: big cards for recent feature highlights (with dates) above a skinny row of smaller improvement chips, both sourced from this changelog. Removed the 'See what's new' navbar link in favor of it."
      - "Fixed grade-plot functions left broken by the instructor-points toggle: plot_grades_for_course_report built instructor point data even when disabled (the DFW subtab error), and get_grades_for_dept_report referenced an undefined include_instructor_points (the dept-report plot error)."
      - "Trimmed the persistent Pathways scope bar so the per-outcome Major / Pre-major breakdown lives only on the Population audit subtab instead of repeating on every analysis tab."
      - "Converted ~440 Unicode escape sequences in R source to real UTF-8 glyphs and added a UTF-8 LC_CTYPE guard to .Rprofile so local, CI, and container R parse source identically; replaced embedded non-breaking spaces with CSS white-space:nowrap."
      - "Test-environment cleanup: made get_reg_stats absence-safe for the optional cedar_cl_enrls_base cache; stopped test-load-funcs.R from leaking production config thresholds into later tests; refreshed stale regstats and headcount expectations; removed the obsolete update_codes test."

