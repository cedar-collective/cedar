services:

  cedar-shiny:
    build:
      context: .
      dockerfile: Dockerfile.shiny
    platform: linux/amd64
    container_name: cedar-shiny
    ports:
      - "3838:3838"
    restart: unless-stopped
    networks:
      - shiny-net
    volumes:
      - ${CEDAR_DATA_DIR}:/srv/shiny-server/cedar/data
      # Projection artifacts are published outside Shiny and consumed read-only.
      - ./output:/srv/shiny-server/cedar/output:ro

#volumes:
  #shared-data:

networks:
  shiny-net:
    external: true
